def targetMcVersion = project.findProperty('mcVersion') ?: '1.21.4'

allprojects {
    group = 'com.minelatino.cosmetics'
    version = '0.1.0-alpha.49'
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java'
    // OneDrive can attach a deny-delete ACL to generated class directories. CI and
    // local release builds may redirect disposable outputs without moving sources.
    def externalBuildRoot = System.getenv('MINELATINO_BUILD_ROOT')
    layout.buildDirectory = externalBuildRoot
        ? file("${externalBuildRoot}/${targetMcVersion}/${project.name}")
        : rootProject.layout.projectDirectory.dir("build/${targetMcVersion}/${project.name}")
    def targetJavaVersion = targetMcVersion == '26.2' ? 25 : 21
    java.toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = targetJavaVersion }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}

task deployToLocal(dependsOn: [':fabric:build']) {
    group = 'deployment'
    description = 'Copies the Fabric JAR to the local Fabric instance (never installs Forge there)'
    doLast {
        def configuredModsDir = project.findProperty('localInstanceModsDir')?.toString()
        if (!configuredModsDir && !System.getProperty('os.name').toLowerCase().contains('windows')) {
            throw new GradleException('Set -PlocalInstanceModsDir=/path/to/instance/mods before using deployToLocal outside Windows')
        }
        def instanceModsDir = file(configuredModsDir ?: 'E:/.minecraftx/instances/Minecraft 1.21.4 fabric/mods')
        def modPrefix = "minelatino-cosmetics-fabric-"
        def mcVersion = project.findProperty('mcVersion') ?: '1.21.4'
        if (mcVersion != '1.21.4') throw new GradleException('This local instance is Minecraft 1.21.4 only')
        def fabricJar = file("${project(':fabric').layout.buildDirectory.get().asFile}/libs/minelatino-cosmetics-fabric-${mcVersion}-${version}.jar")
        if (!fabricJar.isFile()) throw new GradleException('Fabric JAR missing; existing mods were not changed')
        instanceModsDir.mkdirs()
        // Delete old cosmetic JARs from instance mods folder
        if (instanceModsDir.exists()) {
            instanceModsDir.eachFileMatch(~/^${modPrefix}.*\.jar$/) { old ->
                old.delete()
                println "Removed old: ${old.name}"
            }
        }
        // Copy new Fabric JAR
        if (fabricJar.exists()) {
            java.nio.file.Files.copy(fabricJar.toPath(), new File(instanceModsDir, fabricJar.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "Deployed: ${fabricJar.name} -> ${instanceModsDir}"
        }
    }
}
